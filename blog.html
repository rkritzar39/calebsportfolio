<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blog-container">
        <!-- Navigation -->
        <nav class="blog-navbar">
            <div class="blog-navbar-brand">
                <h1>Blog</h1>
            </div>
            <ul class="blog-navbar-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="lms.html" class="nav-link">Learning Center</a></li>
            </ul>
        </nav>

        <!-- Main Blog Content -->
        <main class="blog-main">
            <div class="blog-header">
                <h1>Blog Posts</h1>
                <p class="blog-subtitle">Latest articles and updates</p>
            </div>

            <!-- Blog Feed Container -->
            <div id="blog-feed" class="blog-feed">
                <!-- Blog posts will be injected here by admin tool -->
                <div class="empty-state">
                    <div class="empty-state-icon">✍️</div>
                    <h2>No blog posts published yet</h2>
                    <p>Check back soon for new articles and insights.</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="blog-footer">
            <p>&copy; 2024 My Portfolio. All rights reserved.</p>
        </footer>
    </div>

    <script src="blog.js"></script>
</body>
</html>
