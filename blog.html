  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />

  <script>
    (() => {
      try {
        const settings = JSON.parse(localStorage.getItem("websiteSettings") || "{}");
        const savedTheme = settings.theme || settings.appearance || settings.themeMode || localStorage.getItem("theme") || localStorage.getItem("websiteTheme") || "dark";
        const normalizedTheme = String(savedTheme).trim().toLowerCase();
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        const usesDeviceTheme = normalizedTheme === "system" || normalizedTheme === "device" || normalizedTheme === "auto" || normalizedTheme.includes("match");
        const isLightTheme = normalizedTheme.includes("light") || (usesDeviceTheme && prefersLight);
        const appearanceClass = isLightTheme ? "light-mode" : "dark-mode";
        document.documentElement.classList.add(appearanceClass);
        document.documentElement.dataset.theme = isLightTheme ? "light" : "dark";
      } catch (error) {
        document.documentElement.classList.add("dark-mode");
      }
    })();
  </script>
</head>

    <!-- Blog Header -->
    <section class="blog-header section">
      <div class="blog-header-content">
        <h1>Blog</h1>
        <p class="blog-subtitle">Insights on technology, coding, and personal growth.</p>
      </div>
    </section>

    <!-- Search & Filter -->
    <section class="blog-controls section">
      <div class="search-container unified">
        <span class="search-icon"></span>
        <input type="search" id="blog-search" class="creator-search" placeholder="Search blog posts..." aria-label="Search blog posts" autocomplete="off" />
        <button type="button" id="blog-search-clear" class="tech-search-clear" aria-label="Clear search" hidden>×</button>
      </div>

      <div class="blog-filters">
        <button class="blog-filter-chip active" data-filter="all">All Posts</button>
        <button class="blog-filter-chip" data-filter="technology">Technology</button>
        <button class="blog-filter-chip" data-filter="coding">Coding</button>
        <button class="blog-filter-chip" data-filter="personal">Personal</button>
      </div>
    </section>

    <!-- Blog Posts Grid -->
    <section class="blog-posts section" id="blog-posts-container">
      <p style="text-align: center; color: var(--text-secondary);">Loading blog posts...</p>
    </section>

    <!-- Empty State -->
    <section id="blog-empty-state" class="blog-empty-state section" hidden>
      <i class="fas fa-search"></i>
      <h3>No Posts Found</h3>
      <p>Try adjusting your search or filter criteria.</p>
    </section>

    <!-- Footer -->
    <footer class="no-rearrange" id="site-footer">

    </footer>
