<script data-education-link-settings="">
(() => {
  const syncEducationLinks = () => {
    try {
      const settings = JSON.parse(localStorage.getItem("websiteSettings") || "{}");
      document.querySelectorAll("[data-education-link]").forEach(link => {
        link.hidden = settings.showEducationPage === "disabled";
      });
    } catch (_) {}
  };
  syncEducationLinks();
  window.addEventListener("storage", e => {
    if (e.key === "websiteSettings") syncEducationLinks();
  });
})();
</script>
